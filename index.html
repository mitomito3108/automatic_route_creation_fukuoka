<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>福岡 経由地最適化（Web版）</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="logo">🚗</div>
      <div>
        <h1>福岡 経由地最適化</h1>
        <p>始点：福岡市役所 | Google Mapsで最適巡回ルート（車1〜3台）</p>
      </div>
    </div>
    <div class="header-actions">
      <a href="#" id="selectAll" class="text-link">全選択</a>
      <span class="sep">|</span>
      <a href="#" id="clearSelection" class="text-link">選択解除</a>
    </div>
  </header>

  <main class="container">
    <section class="controls card">
      <div class="field">
        <label for="carCount">使用する車の台数</label>
        <select id="carCount" class="input">
          <option value="1">1台</option>
          <option value="2">2台</option>
          <option value="3">3台</option>
        </select>
      </div>

      <div class="field">
        <label>経由地（チェックで複数選択）</label>
        <div id="poiList" class="checkbox-grid" aria-label="観光地を選択"></div>
      </div>

      <div class="field">
        <label>選択中</label>
        <div id="selectedTags" class="taglist"></div>
      </div>

      <div class="actions">
        <button id="calcBtn" class="btn primary">ルート計算</button>
        <button id="clearBtn" class="btn">クリア</button>
      </div>
    </section>

    <section class="map-wrap">
      <div id="map" class="map card"></div>
      <aside class="side card">
        <h3>凡例</h3>
        <ul class="legend">
          <li><span class="swatch" style="background:#1a73e8"></span> 車1（青）</li>
          <li><span class="swatch" style="background:#34a853"></span> 車2（緑）</li>
          <li><span class="swatch" style="background:#ea4335"></span> 車3（赤）</li>
        </ul>
        <h3>合計</h3>
        <div id="totals" class="totals"></div>
        <h3>ステータス</h3>
        <div id="status" class="status"></div>
      </aside>
    </section>
  </main>
　<div id="routeDetail"></div>
  <footer class="footer">
    <small>© 福岡 経由地最適化デモ | Google Maps JavaScript API（Places/Geometry）を利用</small>
  </footer>

  <!-- Google Maps JavaScript API（Places/Geometry ライブラリ読み込み） -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBXskYss6vmHiYblfLtD2kpuY-ELrHRr2c&libraries=places,geometry&language=ja"></script>
  <script src="app.js"></script>
</body>
</html>
